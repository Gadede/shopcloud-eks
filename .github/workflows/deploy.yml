name: CI/CD — Build, Push, Deploy to EKS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: shopcloud-prod
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

# Required for OIDC
permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Test Services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Test all services
        run: |
          for SERVICE in product-service order-service user-service payment-service notification-service; do
            echo "Installing $SERVICE..."
            cd services/$SERVICE && npm ci && cd ../..
          done
          echo "✅ All services passed"

  build-and-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      # OIDC — no access keys needed
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Generate image tag
        id: meta
        run: echo "tag=main-${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push all services
        run: |
          TAG=${{ steps.meta.outputs.tag }}
          REGISTRY=${{ env.ECR_REGISTRY }}

          for SERVICE in frontend product-service order-service user-service payment-service notification-service; do
            echo "Building $SERVICE..."
            docker build -t $REGISTRY/shopcloud/$SERVICE:$TAG \
                         -t $REGISTRY/shopcloud/$SERVICE:latest \
                         ./services/$SERVICE
            docker push $REGISTRY/shopcloud/$SERVICE:$TAG
            docker push $REGISTRY/shopcloud/$SERVICE:latest
            echo "✅ Pushed $SERVICE"
          done

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      # OIDC again for the deploy job
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-Deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Update image tags in manifests
        run: |
          TAG=${{ needs.build-and-push.outputs.image-tag }}
          ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          sed -i "s|ACCOUNT_ID|${ACCOUNT_ID}|g" k8s/base/deployments.yaml
          sed -i "s|:latest|:${TAG}|g" k8s/base/deployments.yaml

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/hpa-and-secrets.yaml
          kubectl apply -f k8s/base/deployments.yaml
          kubectl apply -f k8s/base/services.yaml
          kubectl apply -f k8s/base/ingress.yaml

      - name: Wait for rollout
        run: |
          for DEP in frontend product-service order-service user-service payment-service notification-service; do
            kubectl rollout status deployment/$DEP -n shopcloud --timeout=300s
          done

      - name: Print live URL
        run: |
          echo "🚀 Live at:"
          kubectl get ingress shopcloud-ingress -n shopcloud \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'