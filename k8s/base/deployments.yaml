# ─────────────────────────────────────────────
# FRONTEND
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shopcloud
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 882434014807.dkr.ecr.us-east-2.amazonaws.com/shopcloud/frontend:latest
          ports:
            - containerPort: 80
          env:
            - name: REACT_APP_PRODUCT_SERVICE
              value: "http://product-service.shopcloud.svc.cluster.local:3001"
            - name: REACT_APP_ORDER_SERVICE
              value: "http://order-service.shopcloud.svc.cluster.local:3002"
            - name: REACT_APP_USER_SERVICE
              value: "http://user-service.shopcloud.svc.cluster.local:3003"
            - name: REACT_APP_PAYMENT_SERVICE
              value: "http://payment-service.shopcloud.svc.cluster.local:3004"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
---
# ─────────────────────────────────────────────
# PRODUCT SERVICE
# ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: shopcloud
  labels:
    app: product-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: 882434014807.dkr.ecr.us-east-2.amazonaws.com/shopcloud/product-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 30
---
